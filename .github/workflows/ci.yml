name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Chạy `make check` của dự án: lint, format, type, test theo stack.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: make check
        run: make check

  docs:
    # Kiểm tra link giữa các file trong repo. Không gọi ra internet.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra link trong tài liệu
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
