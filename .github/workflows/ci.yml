name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    # Chỉ kiểm tra link nội bộ. Thêm job ứng dụng khi dự án đã có lệnh và môi trường thật.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md' '.github/**/*.md'
          fail: true
